version: '3.8'

services:
  backend:
    image: flask-app
    build:
      context: ./backend
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=postgres://user:password@db:5432/moviemind

  frontend:
    image: node-app
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    environment:
      - NODE_ENV=development

volumes:
  data: